name: adolat_ai
description: >
  Adolat AI — O'zbekiston fuqarolari va tashkilotlariga huquqiy yordam,
  adolat, tartib va qonuniy murojaatlarni soddalashtirish platformasi.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Backend
  supabase_flutter: ^2.5.6

  # Networking
  dio: ^5.4.3

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Fayl tanlash (dalil/hujjat biriktirish uchun)
  file_picker: ^8.1.2

  # Immutable models / value classes
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  cupertino_icons: ^1.0.8
  drift: ^2.25.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.25.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
